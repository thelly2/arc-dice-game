<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARC Dice Game V3 TEST</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #111827, #1f2937);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .game-box {
      width: 100%;
      max-width: 500px;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
      color: #facc15;
    }

    .big-warning {
      margin-top: 10px;
      margin-bottom: 20px;
      padding: 14px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .connected {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .connect-btn {
      background: #22c55e;
      color: white;
    }

    .roll-btn {
      background: #3b82f6;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .wallet-box, .result-box, .message-box {
      margin-top: 14px;
      padding: 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
    }

    .wallet-box {
      color: #86efac;
      font-size: 14px;
      word-break: break-word;
    }

    .dice {
      font-size: 100px;
      margin: 24px 0;
    }

    .rolling {
      animation: shake 0.15s infinite;
    }

    @keyframes shake {
      0% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(10deg) scale(1.08); }
      50% { transform: rotate(0deg) scale(1.12); }
      75% { transform: rotate(-10deg) scale(1.08); }
      100% { transform: rotate(0deg) scale(1); }
    }

    .result-box {
      font-size: 22px;
      font-weight: bold;
      color: #facc15;
    }

    .message-box {
      font-size: 18px;
      font-weight: bold;
    }

    .win {
      color: #22c55e;
    }

    .lose {
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="game-box">
    <h1>🎲 ARC Dice Game V3 TEST</h1>

    <div class="big-warning" id="statusBanner">
      🚨 CONNECT WALLET FIRST BEFORE YOU CAN PLAY
    </div>

    <button class="connect-btn" id="connectBtn" onclick="connectWallet()">🔗 Connect Wallet</button>

    <div class="wallet-box" id="walletBox">Wallet not connected</div>

    <div class="dice" id="diceDisplay">🎲</div>

    <button class="roll-btn" id="rollBtn" onclick="rollDice()">🎲 Roll Dice</button>

    <div class="result-box" id="resultBox">Result: -</div>
    <div class="message-box" id="messageBox">Waiting for wallet connection...</div>
  </div>

  <script>
    let walletConnected = false;
    let isRolling = false;

    const diceFaces = {
      1: "⚀",
      2: "⚁",
      3: "⚂",
      4: "⚃",
      5: "⚄",
      6: "⚅"
    };

    function connectWallet() {
      const walletBox = document.getElementById("walletBox");
      const messageBox = document.getElementById("messageBox");
      const connectBtn = document.getElementById("connectBtn");
      const statusBanner = document.getElementById("statusBanner");

      walletConnected = true;

      const fakeWallet = "0x" + Math.random().toString(16).substring(2, 14) + "...";
      walletBox.textContent = "Connected: " + fakeWallet;
      messageBox.textContent = "✅ Wallet connected! Now you can roll.";
      messageBox.className = "message-box";
      connectBtn.textContent = "✅ Wallet Connected";
      connectBtn.disabled = true;

      statusBanner.textContent = "✅ WALLET CONNECTED — YOU CAN NOW PLAY";
      statusBanner.classList.add("connected");
    }

    function rollDice() {
      const messageBox = document.getElementById("messageBox");
      const resultBox = document.getElementById("resultBox");
      const diceDisplay = document.getElementById("diceDisplay");
      const rollBtn = document.getElementById("rollBtn");

      if (!walletConnected) {
        messageBox.textContent = "❌ CONNECT WALLET FIRST!";
        messageBox.className = "message-box lose";
        return;
      }

      if (isRolling) return;

      isRolling = true;
      rollBtn.disabled = true;
      resultBox.textContent = "Result: Rolling...";
      messageBox.textContent = "🎲 Dice is rolling...";
      messageBox.className = "message-box";
      diceDisplay.classList.add("rolling");

      let count = 0;

      const rolling = setInterval(() => {
        const temp = Math.floor(Math.random() * 6) + 1;
        diceDisplay.textContent = diceFaces[temp];
        count++;

        if (count >= 15) {
          clearInterval(rolling);

          const finalRoll = Math.floor(Math.random() * 6) + 1;
          diceDisplay.textContent = diceFaces[finalRoll];
          diceDisplay.classList.remove("rolling");

          resultBox.textContent = "Result: " + finalRoll;

          if (finalRoll === 6) {
            messageBox.textContent = "🎉 YOU WON! Rolled a 6!";
            messageBox.className = "message-box win";
          } else {
            messageBox.textContent = "😅 You rolled " + finalRoll + ". Try again!";
            messageBox.className = "message-box lose";
          }

          rollBtn.disabled = false;
          isRolling = false;
        }
      }, 120);
    }
  </script>
</body>
</html>
